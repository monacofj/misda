[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "misda"
version = "0.4.2"
description = "MISDA: Maximal Independent Structural Dimensionality Analysis"
readme = "README.md"
authors = [
  { name = "OpenSciLabs", email = "monaco@usp.br" },
]
license = { text = "GPL-3.0-or-later" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.20",
    "pandas>=1.3",
    "scipy>=1.7",
    "networkx>=2.6",
    "matplotlib>=3.5",
    "scikit-learn>=1.0",
]
requires-python = ">=3.8"

[project.optional-dependencies]
benchmarks = []

[project.urls]
Homepage = "https://github.com/monacofj/misda"

[tool.setuptools]
packages = ["misda", "misda.benchmarks"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "slow: exercises the complete data-driven heavy evaluation protocol",
]
