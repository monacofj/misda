name: acceptance gate

on:
  push:
    branches: [main, new-benchmark]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[benchmarks]' pytest nbconvert nbformat jupyter
      - name: Remote benchmark extra smoke test
        if: github.event_name == 'pull_request'
        env:
          MISDA_REF: ${{ github.head_ref }}
        run: |
          python -m venv /tmp/misda-benchmarks-venv
          /tmp/misda-benchmarks-venv/bin/python -m pip install --upgrade pip
          /tmp/misda-benchmarks-venv/bin/python -m pip install \
            "misda[benchmarks] @ git+https://github.com/monacofj/misda.git@${MISDA_REF}"
          cd /tmp
          /tmp/misda-benchmarks-venv/bin/python - <<'PY'
          import misda
          import moeabench as mb
          print(misda.__file__)
          print(mb.__file__)
          print('MISDA [benchmarks] remote install: OK')
          PY
      - name: Remote PR package smoke test
        if: github.event_name == 'pull_request'
        env:
          MISDA_REF: ${{ github.head_ref }}
        run: |
          python -m pip install --no-deps --target /tmp/misda-remote \
            "git+https://github.com/monacofj/misda.git@${MISDA_REF}"
          cd /tmp
          PYTHONPATH=/tmp/misda-remote python - <<'PY'
          import misda
          assert misda.__file__.startswith('/tmp/misda-remote/')
          assert hasattr(misda.MISSet, 'front_plot')
          assert hasattr(misda.MISSet, 'evaluate')
          assert hasattr(misda.Ranking, 'mis')
          assert hasattr(misda.MISCandidate, 'report')
          assert hasattr(misda.MISCandidate, 'graph_plot')
          assert hasattr(misda.MISCandidate, 'front_plot')
          print(misda.__file__)
          print('MISSet.evaluate / Ranking.mis / MIS views: OK')
          PY
      - name: Public reporting contract
        run: |
          pytest -q \
            tests/test_reporting_contract.py \
            tests/test_benchmark_report_sections.py \
            tests/test_benchmark_report_evidence.py \
            tests/test_pareto_stability.py
      - name: Full test suite
        run: pytest -q
      - name: Controlled clean scientific battery
        run: python -m benchmarks.run_controlled --strict --output /tmp/misda-controlled.json
      - name: Preserve controlled artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: misda-controlled
          path: /tmp/misda-controlled.json
          if-no-files-found: warn
      - name: Diagnostic method comparison
        run: python -m benchmarks.run_comparison --output /tmp/misda-comparison.json
      - name: Preserve comparison artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: misda-comparison
          path: /tmp/misda-comparison.json
          if-no-files-found: warn
