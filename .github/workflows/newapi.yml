name: acceptance gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[benchmarks]' pytest nbconvert nbformat jupyter
      - name: Full test suite
        run: pytest -q
      - name: Clean diagnostic scientific battery
        run: python -m examples.benchmarks.run_benchmark --strict --output /tmp/misda-diagnostic-clean.json
      - name: Preserve clean diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: misda-diagnostic-clean
          path: /tmp/misda-diagnostic-clean.json
          if-no-files-found: warn
      - name: Comparative experiments
        run: python -m examples.benchmarks.run_comparative --output /tmp/misda-comparative.json
      - name: Preserve comparative artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: misda-comparative
          path: /tmp/misda-comparative.json
          if-no-files-found: warn
