name: ranking policy impact

on:
  workflow_dispatch:
    inputs:
      run_core:
        description: 'Run controlled, controlled_noisy, comparison, and audit contract tests'
        required: true
        type: boolean
        default: false
      run_sampling:
        description: 'Run clean sampling robustness audit'
        required: true
        type: boolean
        default: false
      run_noisy:
        description: 'Run observation-noise robustness audit'
        required: true
        type: boolean
        default: false
      run_aggressiveness:
        description: 'Run policy × aggressiveness follow-up probe'
        required: true
        type: boolean
        default: false
      run_resampling:
        description: 'Run fixed-candidate ranking-evidence resampling probe'
        required: true
        type: boolean
        default: false

jobs:
  validate-selection:
    runs-on: ubuntu-latest
    steps:
      - name: Require an explicit audit selection
        if: ${{ !inputs.run_core && !inputs.run_sampling && !inputs.run_noisy && !inputs.run_aggressiveness && !inputs.run_resampling }}
        run: |
          echo '::error::Select at least one ranking-policy audit explicitly when dispatching this workflow.'
          exit 1
      - name: Confirm selected audits
        run: |
          echo "core=${{ inputs.run_core }}"
          echo "sampling=${{ inputs.run_sampling }}"
          echo "noisy=${{ inputs.run_noisy }}"
          echo "aggressiveness=${{ inputs.run_aggressiveness }}"
          echo "resampling=${{ inputs.run_resampling }}"

  core:
    needs: validate-selection
    if: ${{ inputs.run_core }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[benchmarks]' pytest
      - name: Audit contract tests
        run: pytest -q tests/test_ranking_policy_impact.py
      - name: Controlled, fixed-noise, and comparison audit
        run: |
          python -m benchmarks.run_ranking_policy_impact \
            --suite controlled \
            --suite controlled_noisy \
            --suite comparison \
            --output /tmp/misda-ranking-policy-impact-core.json
      - name: Preserve core audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: misda-ranking-policy-impact-core
          path: /tmp/misda-ranking-policy-impact-core.json
          if-no-files-found: warn

  sampling:
    needs: validate-selection
    if: ${{ inputs.run_sampling }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[benchmarks]'
      - name: Clean sampling robustness audit
        run: |
          python -m benchmarks.run_ranking_policy_impact \
            --suite sampling_robustness \
            --output /tmp/misda-ranking-policy-impact-sampling.json
      - name: Preserve sampling audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: misda-ranking-policy-impact-sampling
          path: /tmp/misda-ranking-policy-impact-sampling.json
          if-no-files-found: warn

  noisy:
    needs: validate-selection
    if: ${{ inputs.run_noisy }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[benchmarks]'
      - name: Observation-noise robustness audit
        run: |
          python -m benchmarks.run_ranking_policy_impact \
            --suite noisy_robustness \
            --output /tmp/misda-ranking-policy-impact-noisy.json
      - name: Preserve noisy audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: misda-ranking-policy-impact-noisy
          path: /tmp/misda-ranking-policy-impact-noisy.json
          if-no-files-found: warn

  aggressiveness:
    needs: validate-selection
    if: ${{ inputs.run_aggressiveness }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[benchmarks]'
      - name: Policy by aggressiveness probe
        run: |
          python -m benchmarks.run_ranking_policy_aggressiveness_probe \
            --output /tmp/misda-ranking-policy-aggressiveness.json
      - name: Preserve aggressiveness probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: misda-ranking-policy-aggressiveness
          path: /tmp/misda-ranking-policy-aggressiveness.json
          if-no-files-found: warn

  resampling:
    needs: validate-selection
    if: ${{ inputs.run_resampling }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[benchmarks]' pytest
      - name: Resampling contract tests
        run: pytest -q tests/test_ranking_resampling.py
      - name: Ranking evidence resampling probe
        run: |
          python -m benchmarks.run_ranking_resampling_probe \
            --output /tmp/misda-ranking-resampling.json
      - name: Preserve resampling probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: misda-ranking-resampling
          path: /tmp/misda-ranking-resampling.json
          if-no-files-found: warn
