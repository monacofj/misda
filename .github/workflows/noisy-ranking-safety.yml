name: noisy ranking safety

on:
  push:
    branches:
      - issue-84-noisy-ranking-safety
    paths:
      - "benchmarks/run_noisy_ranking_safety.py"
      - "benchmarks/run_noisy_ranking_optimization.py"
      - "tests/test_noisy_ranking_safety.py"
      - ".github/workflows/noisy-ranking-safety.yml"
      - "docs/research-notes/2026-10-noisy-ranking-safety.md"
  workflow_dispatch:

jobs:
  screening:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[benchmarks]' pytest
      - name: Helper tests
        run: pytest -q tests/test_noisy_ranking_safety.py
      - name: DTLZ5 and DPF1 noisy screening grid
        run: |
          python -m benchmarks.run_noisy_ranking_safety \
            --output /tmp/misda-noisy-ranking-safety.json
      - name: Established controlled noisy-robustness audit
        run: |
          python -m benchmarks.run_ranking_policy_impact \
            --suite noisy_robustness \
            --problem-id nonlinear_blocks_4x5 \
            --output /tmp/misda-noisy-policy-impact.json
      - name: Preserve screening outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: misda-noisy-ranking-safety
          path: |
            /tmp/misda-noisy-ranking-safety.json
            /tmp/misda-noisy-policy-impact.json
          if-no-files-found: warn
