name: alpha-null envelope implementation

on:
  push:
    branches: [alpha-null-envelope]
    paths:
      - '.github/workflows/alpha-null-envelope-implementation.yml'
      - '.github/alpha-null-envelope-apply.py'
      - 'tests/test_evaluation_scope.py'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alpha-null-envelope
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Apply implementation
        run: python .github/alpha-null-envelope-apply.py
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[benchmarks]' pytest nbconvert nbformat jupyter
      - name: Full test suite
        run: pytest -q
      - name: Clean diagnostic scientific battery
        run: python -m examples.benchmarks.run_benchmark --strict --output /tmp/misda-diagnostic-clean-envelope.json
      - name: Commit implementation to branch
        run: |
          rm .github/workflows/alpha-null-envelope-implementation.yml
          rm .github/alpha-null-envelope-apply.py
          git config user.name 'Dr. Monaco F. J.'
          git config user.email 'monaco@usp.br'
          git add -A
          git commit -m 'fix(statistics): use empirical null envelope for alpha_null'
          git push origin HEAD:alpha-null-envelope
