name: threshold calibration experiment

on:
  push:
    branches: [main]
    paths: ['.github/workflows/threshold-calibration-experiment.yml']

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[benchmarks]'
      - name: Compare null calibrations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import networkx as nx
          import numpy as np
          import misda
          import misda.benchmarks as bench

          N = 300
          M = 20
          B = N
          MISDA_SEED = 123

          def standardize(Y):
              X = np.asarray(Y, dtype=float)
              centered = X - X.mean(axis=0)
              ss = np.sum(centered * centered, axis=0)
              scale = np.sqrt(ss)
              Z = np.zeros_like(centered)
              active = scale > 0
              Z[:, active] = centered[:, active] / scale[active]
              return Z

          def null_thresholds(Y, seed=MISDA_SEED, B=B):
              Z = standardize(Y)
              rng = np.random.default_rng(seed)
              iu = np.triu_indices(Z.shape[1], 1)
              permuted = np.empty_like(Z)
              maxima_pos = np.empty(B)
              maxima_abs = np.empty(B)
              for b in range(B):
                  for col in range(Z.shape[1]):
                      permuted[:, col] = rng.permutation(Z[:, col])
                  C = permuted.T @ permuted
                  np.clip(C, -1.0, 1.0, out=C)
                  vals = C[iu]
                  maxima_pos[b] = max(0.0, float(np.max(vals, initial=0.0)))
                  maxima_abs[b] = float(np.max(np.abs(vals), initial=0.0))
              return {
                  'mean_pos': float(maxima_pos.mean()),
                  'mean_abs': float(maxima_abs.mean()),
                  'max_pos': float(maxima_pos.max()),
                  'max_abs': float(maxima_abs.max()),
              }

          def independence_number_from_mask(mask):
              G = nx.from_numpy_array(mask.astype(int))
              if G.number_of_nodes() == 0:
                  return 0
              return max((len(c) for c in nx.find_cliques(nx.complement(G))), default=0)

          def dimensions(Y, r_pos, r_signed):
              C = np.corrcoef(np.asarray(Y, dtype=float), rowvar=False)
              np.fill_diagonal(C, 0.0)
              pos = (C > 0.0) & (C >= r_pos)
              signed = np.abs(C) >= r_signed
              np.fill_diagonal(pos, False)
              np.fill_diagonal(signed, False)
              return {
                  'structural': int(independence_number_from_mask(pos)),
                  'latent': int(independence_number_from_mask(signed)),
                  'positive_edges': int(np.triu(pos, 1).sum()),
                  'signed_edges': int(np.triu(signed, 1).sum()),
              }

          canonical = []
          for problem in bench.PROBLEMS:
              dataset = problem.generate(N=N, seed=123, sigma=0.0)
              Y = dataset.Y.to_numpy()
              null = null_thresholds(Y)
              current = misda.discover(dataset.Y, seed=MISDA_SEED)
              schemes = {
                  'A_mean_positive_shared': dimensions(Y, null['mean_pos'], null['mean_pos']),
                  'B_separate_means': dimensions(Y, null['mean_pos'], null['mean_abs']),
                  'C_separate_maxima': dimensions(Y, null['max_pos'], null['max_abs']),
              }
              canonical.append({
                  'problem_id': problem.id,
                  'truth_latent': problem.scenario.latent_expected,
                  'truth_structural': problem.scenario.structural_expected,
                  'current': {
                      'latent': current.analysis.latent_dimension,
                      'structural': current.analysis.structural_dimension,
                  },
                  'null': null,
                  'schemes': schemes,
              })

          replicate_seeds = tuple(range(1001, 1051))
          case1 = bench.PROBLEM_BY_ID['independence']
          case1_rows = []
          for sample_seed in replicate_seeds:
              dataset = case1.generate(N=N, seed=sample_seed, sigma=0.0)
              Y = dataset.Y.to_numpy()
              C = np.corrcoef(Y, rowvar=False)
              vals = C[np.triu_indices(M, 1)]
              null = null_thresholds(Y)
              schemes = {
                  'A_mean_positive_shared': dimensions(Y, null['mean_pos'], null['mean_pos']),
                  'B_separate_means': dimensions(Y, null['mean_pos'], null['mean_abs']),
                  'C_separate_maxima': dimensions(Y, null['max_pos'], null['max_abs']),
              }
              case1_rows.append({
                  'sample_seed': sample_seed,
                  'observed_max_positive': float(np.max(vals)),
                  'observed_max_absolute': float(np.max(np.abs(vals))),
                  'null': null,
                  'schemes': schemes,
              })

          rates = {}
          for scheme in ('A_mean_positive_shared', 'B_separate_means', 'C_separate_maxima'):
              rates[scheme] = {
                  'structural_exact_rate': float(np.mean([r['schemes'][scheme]['structural'] == M for r in case1_rows])),
                  'latent_exact_rate': float(np.mean([r['schemes'][scheme]['latent'] == M for r in case1_rows])),
                  'mean_positive_edges': float(np.mean([r['schemes'][scheme]['positive_edges'] for r in case1_rows])),
                  'mean_signed_edges': float(np.mean([r['schemes'][scheme]['signed_edges'] for r in case1_rows])),
              }

          result = {
              'N': N,
              'M': M,
              'B': B,
              'canonical': canonical,
              'case1_replicates': case1_rows,
              'case1_rates': rates,
          }
          Path('/tmp/threshold-calibration.json').write_text(json.dumps(result, indent=2), encoding='utf-8')
          print(json.dumps(rates, indent=2))
          for row in canonical:
              print(row['problem_id'], row['truth_latent'], row['truth_structural'], row['current'], row['schemes'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: threshold-calibration
          path: /tmp/threshold-calibration.json
          if-no-files-found: error
