name: notebook setup migration

on:
  push:
    branches: [main]
    paths: ['.github/workflows/notebook-setup-migration.yml']

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite notebook setup cells
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = [
              Path('examples/benchmark.ipynb'),
              Path('examples/benchmark_noisy.ipynb'),
              Path('examples/diagnostic_robustness.ipynb'),
              Path('examples/comparison.ipynb'),
              Path('examples/classical_mops.ipynb'),
          ]
          old = 'target = ".[benchmarks]" if Path("pyproject.toml").exists() else "git+https://github.com/monacofj/misda.git@main#egg=misda[benchmarks]"\n'
          new = (
              'repo_root = next((p for p in (Path.cwd(), *Path.cwd().parents) if (p / "pyproject.toml").exists()), None)\n'
              'target = f"{repo_root}[benchmarks]" if repo_root is not None else "misda[benchmarks] @ git+https://github.com/monacofj/misda.git@main"\n'
          )
          old_encoded = json.dumps(old)[1:-1]
          new_encoded = json.dumps(new)[1:-1]
          for path in files:
              text = path.read_text(encoding='utf-8')
              count = text.count(old_encoded)
              if count != 1:
                  raise RuntimeError(f'{path}: expected exactly one legacy setup line, found {count}')
              path.write_text(text.replace(old_encoded, new_encoded), encoding='utf-8')
          PY
      - name: Commit notebook setup migration
        run: |
          git config user.name 'misda-ci'
          git config user.email 'misda-ci@users.noreply.github.com'
          git add examples/benchmark.ipynb examples/benchmark_noisy.ipynb examples/diagnostic_robustness.ipynb examples/comparison.ipynb examples/classical_mops.ipynb
          git diff --cached --quiet && exit 0
          git commit -m 'fix(notebooks): modernize installation setup'
          git push origin HEAD:main
