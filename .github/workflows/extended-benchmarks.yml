name: extended benchmark validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'misda/benchmarks/validation.py'
      - 'benchmarks/run_controlled_noisy.py'
      - 'benchmarks/run_sampling_robustness.py'
      - 'benchmarks/run_noisy_robustness.py'
      - 'benchmarks/controlled_noisy.ipynb'
      - 'benchmarks/sampling_robustness.ipynb'
      - 'benchmarks/noisy_robustness.ipynb'
      - 'tests/test_extended_benchmark_clis.py'
      - 'tests/test_notebooks.py'
      - 'tests/test_robustness_pareto_stability_notebook.py'
      - '.github/workflows/extended-benchmarks.yml'

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[benchmarks]' pytest
      - name: Extended benchmark smoke tests
        run: pytest -q tests/test_extended_benchmark_clis.py tests/test_notebooks.py tests/test_robustness_pareto_stability_notebook.py
      - name: Fixed-noise controlled benchmark
        run: python -m benchmarks.run_controlled_noisy --output /tmp/misda-controlled-noisy.json
      - name: Preserve fixed-noise controlled artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: misda-controlled-noisy
          path: /tmp/misda-controlled-noisy.json
          if-no-files-found: warn
      - name: Clean sampling robustness
        run: python -m benchmarks.run_sampling_robustness --output /tmp/misda-sampling-robustness.json
      - name: Preserve sampling robustness artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: misda-sampling-robustness
          path: /tmp/misda-sampling-robustness.json
          if-no-files-found: warn
      - name: Observation-noise robustness
        run: python -m benchmarks.run_noisy_robustness --output /tmp/misda-noisy-robustness.json
      - name: Preserve noisy robustness artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: misda-noisy-robustness
          path: /tmp/misda-noisy-robustness.json
          if-no-files-found: warn
