name: ranking policy robustness

on:
  pull_request:
    branches: [main]
    paths:
      - "benchmarks/run_ranking_policy_robustness.py"
      - "benchmarks/run_ranking_policy_probe.py"
      - "misda/api.py"
      - "misda/_pareto.py"
      - "pyproject.toml"
      - ".github/workflows/ranking-policy-robustness.yml"
  workflow_dispatch:

jobs:
  robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[benchmarks]'
      - name: Independent Sobol resampling
        run: |
          python -m benchmarks.run_ranking_policy_robustness \
            --output /tmp/misda-ranking-policy-robustness.json
      - name: Preserve robustness artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: misda-ranking-policy-robustness
          path: /tmp/misda-ranking-policy-robustness.json
          if-no-files-found: warn
