name: Spearman experiment

on:
  push:
    branches: [spearman]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controlled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[benchmarks]'
      - name: Controlled clean
        run: python -m benchmarks.run_controlled --output /tmp/spearman-controlled.json
      - name: Preserve controlled artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spearman-controlled
          path: /tmp/spearman-controlled.json
          if-no-files-found: warn

  controlled-noisy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[benchmarks]'
      - name: Controlled noisy
        run: python -m benchmarks.run_controlled_noisy --output /tmp/spearman-controlled-noisy.json
      - name: Preserve controlled noisy artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spearman-controlled-noisy
          path: /tmp/spearman-controlled-noisy.json
          if-no-files-found: warn

  pearson-controlled-noisy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[benchmarks]'
      - name: Pearson controlled noisy baseline
        run: python -m benchmarks.run_controlled_noisy --output /tmp/pearson-controlled-noisy.json
      - name: Preserve Pearson controlled noisy artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pearson-controlled-noisy
          path: /tmp/pearson-controlled-noisy.json
          if-no-files-found: warn

  monotonic-spearman:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Spearman branch
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[benchmarks]'
      - name: Spearman monotonic benchmark
        run: python -m benchmarks.run_monotonic --output /tmp/spearman-monotonic.json
      - name: Preserve Spearman monotonic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spearman-monotonic
          path: /tmp/spearman-monotonic.json
          if-no-files-found: warn

  monotonic-pearson:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spearman
          path: experiment
      - uses: actions/checkout@v4
        with:
          ref: main
          path: baseline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: baseline/pyproject.toml
      - name: Install Pearson main
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e 'baseline[benchmarks]'
      - name: Pearson monotonic benchmark
        run: python experiment/benchmarks/run_monotonic.py --output /tmp/pearson-monotonic.json
      - name: Preserve Pearson monotonic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pearson-monotonic
          path: /tmp/pearson-monotonic.json
          if-no-files-found: warn
