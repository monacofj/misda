name: null envelope validation

on:
  push:
    branches: [main]
    paths: ['.github/workflows/null-envelope-validation.yml']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[benchmarks]'
      - name: Validate null-envelope candidates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import networkx as nx
          import numpy as np
          import misda.benchmarks as bench

          N = 300
          M = 20
          NULL_SEED = 123
          PREFIXES = (N, 2*N, 5*N, 10*N)

          def standardize(Y):
              X = np.asarray(Y, dtype=float)
              centered = X - X.mean(axis=0)
              ss = np.sum(centered * centered, axis=0)
              scale = np.sqrt(ss)
              Z = np.zeros_like(centered)
              active = scale > 0
              Z[:, active] = centered[:, active] / scale[active]
              return Z

          def null_sequence(Y, B, seed=NULL_SEED):
              Z = standardize(Y)
              rng = np.random.default_rng(seed)
              iu = np.triu_indices(Z.shape[1], 1)
              permuted = np.empty_like(Z)
              pos = np.empty(B)
              absolute = np.empty(B)
              for b in range(B):
                  for col in range(Z.shape[1]):
                      permuted[:, col] = rng.permutation(Z[:, col])
                  C = permuted.T @ permuted
                  np.clip(C, -1.0, 1.0, out=C)
                  vals = C[iu]
                  pos[b] = max(0.0, float(np.max(vals, initial=0.0)))
                  absolute[b] = float(np.max(np.abs(vals), initial=0.0))
              return pos, absolute

          def null_stats(Y, B=N):
              pos, absolute = null_sequence(Y, B)
              return {
                  'mean_pos': float(pos.mean()),
                  'mean_abs': float(absolute.mean()),
                  'max_pos': float(pos.max()),
                  'max_abs': float(absolute.max()),
              }

          def independence_number(mask):
              G = nx.from_numpy_array(mask.astype(int))
              return max((len(c) for c in nx.find_cliques(nx.complement(G))), default=0)

          def dimensions(Y, r_pos, r_signed):
              C = np.corrcoef(np.asarray(Y, dtype=float), rowvar=False)
              np.fill_diagonal(C, 0.0)
              pos = (C > 0.0) & (C >= r_pos)
              signed = np.abs(C) >= r_signed
              np.fill_diagonal(pos, False)
              np.fill_diagonal(signed, False)
              return {
                  'structural': int(independence_number(pos)),
                  'latent': int(independence_number(signed)),
                  'positive_edges': int(np.triu(pos, 1).sum()),
                  'signed_edges': int(np.triu(signed, 1).sum()),
              }

          def schemes(Y, stats):
              return {
                  'mean_positive_shared': dimensions(Y, stats['mean_pos'], stats['mean_pos']),
                  'mean_separate': dimensions(Y, stats['mean_pos'], stats['mean_abs']),
                  'max_positive_shared': dimensions(Y, stats['max_pos'], stats['max_pos']),
                  'max_separate': dimensions(Y, stats['max_pos'], stats['max_abs']),
              }

          regular = tuple(p for p in bench.PROBLEMS if p.id not in {'transitive_chain', 'regime_switching'})
          clean_rows = []
          for problem in regular:
              for sample_seed in range(1001, 1021):
                  X = problem.sample(N=N, seed=sample_seed)
                  Y = problem.evaluate(X)
                  stats = null_stats(Y)
                  clean_rows.append({
                      'problem_id': problem.id,
                      'sample_seed': sample_seed,
                      'truth_latent': problem.scenario.latent_expected,
                      'truth_structural': problem.scenario.structural_expected,
                      'schemes': schemes(Y, stats),
                  })

          clean_rates = {}
          for problem in regular:
              rows = [r for r in clean_rows if r['problem_id'] == problem.id]
              clean_rates[problem.id] = {}
              for scheme in ('mean_positive_shared', 'mean_separate', 'max_positive_shared', 'max_separate'):
                  clean_rates[problem.id][scheme] = {
                      'latent_exact_rate': float(np.mean([r['schemes'][scheme]['latent'] == r['truth_latent'] for r in rows])),
                      'structural_exact_rate': float(np.mean([r['schemes'][scheme]['structural'] == r['truth_structural'] for r in rows])),
                      'mean_positive_edges': float(np.mean([r['schemes'][scheme]['positive_edges'] for r in rows])),
                      'mean_signed_edges': float(np.mean([r['schemes'][scheme]['signed_edges'] for r in rows])),
                  }

          robustness_ids = (
              'independence',
              'total_redundancy',
              'blocks_4x5',
              'monotonic_redundancy',
              'antagonistic_linear_groups',
              'nonlinear_blocks_4x5',
              'antagonistic_nonlinear_groups',
              'transitive_chain',
          )
          sigmas = (0.0, 0.05, 0.10, 0.20, 0.40)
          replicate_seeds = (101, 202, 303, 404, 505)
          robustness_rows = []
          for problem_position, problem_id in enumerate(robustness_ids):
              problem = bench.PROBLEM_BY_ID[problem_id]
              for replicate_seed in replicate_seeds:
                  sample_seed = int(np.random.SeedSequence([replicate_seed, problem_position, 1]).generate_state(1)[0])
                  observation_sequence = np.random.SeedSequence([replicate_seed, problem_position, 2])
                  X = problem.sample(N=N, seed=sample_seed)
                  Z = problem.evaluate(X)
                  epsilon = np.random.default_rng(observation_sequence).normal(size=Z.shape)
                  for sigma in sigmas:
                      Y = problem.observe(Z, sigma=sigma, standard_noise=epsilon)
                      stats = null_stats(Y)
                      robustness_rows.append({
                          'problem_id': problem_id,
                          'replicate_seed': replicate_seed,
                          'sigma': sigma,
                          'truth_latent': problem.scenario.latent_expected,
                          'truth_structural': problem.scenario.structural_expected,
                          'schemes': schemes(Y, stats),
                      })

          robustness_rates = {}
          for problem_id in robustness_ids:
              robustness_rates[problem_id] = {}
              for sigma in sigmas:
                  rows = [r for r in robustness_rows if r['problem_id'] == problem_id and r['sigma'] == sigma]
                  robustness_rates[problem_id][str(sigma)] = {}
                  for scheme in ('mean_positive_shared', 'mean_separate', 'max_positive_shared', 'max_separate'):
                      robustness_rates[problem_id][str(sigma)][scheme] = {
                          'latent_exact_rate': float(np.mean([r['schemes'][scheme]['latent'] == r['truth_latent'] for r in rows])),
                          'structural_exact_rate': float(np.mean([r['schemes'][scheme]['structural'] == r['truth_structural'] for r in rows])),
                      }

          # Sensitivity of max-envelope schemes to the number of null permutations.
          case1 = bench.PROBLEM_BY_ID['independence']
          case1_prefix_rows = []
          for sample_seed in range(1001, 1051):
              X = case1.sample(N=N, seed=sample_seed)
              Y = case1.evaluate(X)
              pos, absolute = null_sequence(Y, max(PREFIXES))
              for B in PREFIXES:
                  stats = {'max_pos': float(pos[:B].max()), 'max_abs': float(absolute[:B].max())}
                  case1_prefix_rows.append({
                      'sample_seed': sample_seed,
                      'B': B,
                      'shared': dimensions(Y, stats['max_pos'], stats['max_pos']),
                      'separate': dimensions(Y, stats['max_pos'], stats['max_abs']),
                  })

          case1_prefix_rates = {}
          for B in PREFIXES:
              rows = [r for r in case1_prefix_rows if r['B'] == B]
              case1_prefix_rates[str(B)] = {
                  'max_positive_shared': {
                      'latent_exact_rate': float(np.mean([r['shared']['latent'] == M for r in rows])),
                      'structural_exact_rate': float(np.mean([r['shared']['structural'] == M for r in rows])),
                  },
                  'max_separate': {
                      'latent_exact_rate': float(np.mean([r['separate']['latent'] == M for r in rows])),
                      'structural_exact_rate': float(np.mean([r['separate']['structural'] == M for r in rows])),
                  },
              }

          canonical_prefix = []
          for problem in bench.PROBLEMS:
              X = problem.sample(N=N, seed=123)
              Y = problem.evaluate(X)
              pos, absolute = null_sequence(Y, max(PREFIXES))
              for B in PREFIXES:
                  max_pos = float(pos[:B].max())
                  max_abs = float(absolute[:B].max())
                  canonical_prefix.append({
                      'problem_id': problem.id,
                      'B': B,
                      'truth_latent': problem.scenario.latent_expected,
                      'truth_structural': problem.scenario.structural_expected,
                      'max_positive_shared': dimensions(Y, max_pos, max_pos),
                      'max_separate': dimensions(Y, max_pos, max_abs),
                  })

          result = {
              'N': N,
              'clean_rates_20_replicates': clean_rates,
              'robustness_rates': robustness_rates,
              'case1_prefix_rates_50_replicates': case1_prefix_rates,
              'canonical_prefix': canonical_prefix,
          }
          Path('/tmp/null-envelope-validation.json').write_text(json.dumps(result, indent=2), encoding='utf-8')
          print('CASE1 PREFIX')
          print(json.dumps(case1_prefix_rates, indent=2))
          print('CLEAN RATES')
          for problem_id, value in clean_rates.items():
              print(problem_id, value)
          print('ROBUSTNESS MAX SCHEMES')
          for problem_id, by_sigma in robustness_rates.items():
              print(problem_id)
              for sigma, value in by_sigma.items():
                  print(' ', sigma, value['max_positive_shared'], value['max_separate'])
          print('CANONICAL PREFIX')
          for row in canonical_prefix:
              print(row)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: null-envelope-validation
          path: /tmp/null-envelope-validation.json
          if-no-files-found: error
